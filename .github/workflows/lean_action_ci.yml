name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Each module importing Mathlib needs about 3–5 GB; the runner has 16 GB.
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      # Installs elan and fetches the Mathlib cache; the build itself is the next step.
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Build (with memory logging)
        run: |
          (while true; do
            echo "== mem $(date +%T): $(free -m | awk '/Mem/{print $3" MB used, "$7" MB available"}'), disk $(df -h / | awk 'NR==2{print $4" free"}')"
            ps -eo rss,etime,args --sort=-rss | head -4 | cut -c1-160
            sleep 15
          done) &
          logger=$!
          set +e
          lake build
          status=$?
          kill $logger
          sudo dmesg | grep -iE "oom|killed process|out of memory" | tail -n 20
          exit $status
