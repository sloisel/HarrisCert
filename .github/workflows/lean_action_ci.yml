name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Each module importing Mathlib needs about 6 GB; the runner has 16 GB.
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
